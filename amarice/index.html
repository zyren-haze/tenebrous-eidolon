<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151a24" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 主题：默认跟随系统，也可在「接口 · 语音」里手动锁浅色 / 深色
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          var forced = null;
          try { forced = localStorage.getItem("amarice_theme"); } catch (e) {}
          var dark = forced === "light" ? false : forced === "auto" ? mq.matches : true;
          document.documentElement.classList.toggle("dark", dark);
        };
        apply();
        if (mq.addEventListener) mq.addEventListener("change", apply);
        else if (mq.addListener) mq.addListener(apply);
        document.addEventListener("visibilitychange", apply);
        window.__amariceApplyTheme = apply;
      })();
    </script>
    <meta name="description" content="Amarice——一个随时在线的朋友，陪你聊天、写同人文。" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./pet.css?v=6">
  </head>

</html>

const list=document.getElementById('list');
const audio=document.getElementById('audio');
const now=document.getElementById('now');
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function play(t){
  audio.src=t.url; audio.play().catch(()=>{});
  now.textContent='正在播放 · '+t.artist+'《'+t.title+'》';
}
async function copy(t){
  try{await navigator.clipboard.writeText(t.url); alert('已复制直链：'+t.title)}
  catch(e){prompt('复制这条直链',t.url)}
}
TRACKS.forEach(t=>{
  const row=document.createElement('div'); row.className='row';
  row.innerHTML='<div class="num">'+String(t.i).padStart(2,'0')+'</div><div class="meta"><div class="title"></div><div class="artist"></div></div><div class="time">'+fmt(t.dur)+'</div><div class="actions"><button>播放</button><button>复制直链</button></div>';
  row.querySelector('.title').textContent=t.title;
  row.querySelector('.artist').textContent=t.artist;
  const bs=row.querySelectorAll('button');
  bs[0].onclick=()=>play(t);
  bs[1].onclick=()=>copy(t);
  list.appendChild(row);
});
